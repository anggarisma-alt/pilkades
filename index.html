<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1D4ED8">
  <title>Real Count Pilkades</title>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <!-- Splash saat aplikasi pertama dimuat -->
  <div id="splash" class="splash" role="status">
    <div class="spinner"></div>
    <div>Memuat aplikasi...</div>
  </div>

  <div id="app">
    <!-- Bilah atas (tampil setelah login) -->
    <header id="appbar" class="appbar" hidden>
      <div class="brand">
        <div class="brand-logo" id="brandLogo"><i class="bi bi-bar-chart-fill"></i></div>
        <div class="brand-txt"><b id="brandDesa">Real Count</b><small id="brandJudul">Pilkades</small></div>
      </div>
      <div class="who" id="whoBox"></div>
      <button class="icon-btn" onclick="toggleTheme()" aria-label="Ganti tema terang/gelap"><i class="bi bi-moon-stars" id="themeIcon"></i></button>
      <button class="icon-btn" onclick="handleLogout()" aria-label="Keluar"><i class="bi bi-box-arrow-right"></i></button>
    </header>

    <div class="shell">
      <nav id="sidenav" class="sidenav" hidden aria-label="Menu utama"></nav>
      <!-- Semua halaman disuntikkan di sini -->
      <main class="main" id="view"></main>
    </div>

    <nav id="bottomnav" class="bottomnav" hidden aria-label="Menu utama"></nav>
  </div>

  <!-- Layar proyektor (overlay layar penuh) -->
  <div id="layarRoot" class="layar" hidden></div>

  <div id="modalRoot"></div>
  <div id="toasts" aria-live="polite"></div>

  <noscript><p style="padding:20px">Aplikasi ini memerlukan JavaScript.</p></noscript>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
